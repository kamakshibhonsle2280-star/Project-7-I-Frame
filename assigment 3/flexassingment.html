<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 600px;
            border: 1px solid black;
        }
        .header , .footer{
            height: 20%;
            background-color: teal;
        }
        .center{
            height: 60%;
            background-color: beige;
            display: flex;
        }
        .left{
            height: 100%;
            width: 30%;
            background-color: coral;
        }
        .right{
            height: 100%;
            width: 70%;
            background-color: blueviolet;
        }
        .top{
            height: 50%;
            background-color:aquamarine ;
        }
        .bottom{
            height: 50%;
            background-color: blue;
            display: flex;
        }
        .b1{
            background-color: red;
            width: 50%;
        }
        .b2{
            background-color: coral;
            width: 50%;
        }
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }

        
    </style>
</head>
<body>
    <h1 align ="center">Flex box</h1>
    <div class="container">
     <div class="header"><h2 align="center"> header</h2></div>
     <div class="center">
          <div class="left"><h2 align="center">left</h2></div>
          <div class="right">
            <div class="top"><h2 align="center">top</h2></div>
            <div class="bottom">
                <div class="bottom1 b1"><h2 align="center">b left</h2></div>
                <div class="bottom1 b2"><h2 align="center">b right</h2></div>
            </div>
          </div> 
        </div>
        <div class="footer"><h3 align="center">footer</h3></div>
        </div>
    
</body>
</html>
